name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict default token permissions to read-only; grant write only where needed
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: Run pytest test suite
  # ─────────────────────────────────────────────────
  test:
    name: Pytest – Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────
  # Job 2: Build Docker image (no push)
  # ─────────────────────────────────────────────────
  docker-build:
    name: Docker – Build Image
    runs-on: ubuntu-latest
    needs: test  # Only attempt build if tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false        # CI only – no push to registry
          tags: cloud-native-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
